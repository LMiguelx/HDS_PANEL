<div class="shell">
  @if (maintenanceBlock.reason(); as reason) {
    <div class="maintenance-block">
      <div class="maintenance-block-card">
        <span class="material-icons maintenance-block-icon" aria-hidden="true">build</span>
        <h1>Sistema en mantenimiento</h1>
        <p>{{ reason }}</p>
        <button uiButton variant="primary" (click)="retryAfterMaintenance()">Reintentar</button>
      </div>
    </div>
  } @else {
    <app-shell-topbar />

    <div class="body">
      <app-shell-sidebar />

      @if (isHandset() && drawer.open()) {
        <div class="scrim" (click)="drawer.close()"></div>
      }

      <main class="content">
        <router-outlet />
      </main>
    </div>
  }
</div>
